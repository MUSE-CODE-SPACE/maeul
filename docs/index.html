<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>마을 · Maeul — on-device NPC LLM, in your browser</title>
<meta name="description" content="A money-free, on-device LLM engine for game-village NPCs. Every bit of inference in this demo runs inside your browser — no server, no API key, $0." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%98%EF%B8%8F%3C/text%3E%3C/svg%3E" />
<style>
  :root {
    --ground:#0b0e14; --panel:#131926; --panel2:#0f141e; --line:rgba(255,255,255,.08);
    --ink:#f4f2ec; --dim:rgba(244,242,236,.58); --faint:rgba(244,242,236,.34);
    --lantern:#ffce6b; --lantern-dim:rgba(255,206,107,.16);
    --good:#4fd67f; --bad:#e8564b; --warn:#f2b04a; --cold:#69b7ff; --muted:#8a93a6;
    --r:14px;
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; color:var(--ink);
    background:
      radial-gradient(1100px 620px at 50% -12%, rgba(255,206,107,.10), transparent 62%),
      radial-gradient(800px 500px at 92% 8%, rgba(105,183,255,.06), transparent 60%),
      var(--ground);
  }
  code, .mono { font-family:ui-monospace,"SF Mono","JetBrains Mono",Menlo,monospace; }
  .wrap { max-width:1120px; margin:0 auto; padding:28px 20px 64px; }

  /* ── Header ── */
  header { display:flex; flex-wrap:wrap; align-items:flex-end; gap:14px 24px; margin-bottom:20px; }
  .brand { font-weight:900; font-size:34px; letter-spacing:-.02em; line-height:1; }
  .brand em { font-style:normal; color:var(--lantern); }
  .brand small { display:block; margin-top:7px; font-size:14px; font-weight:700;
    letter-spacing:.16em; color:var(--faint); }
  .tag { flex:1 1 320px; min-width:260px; color:var(--dim); font-size:15px; line-height:1.6; }
  .tag b { color:var(--ink); }
  .tag .free { color:var(--lantern); font-weight:800; }
  .head-right { display:flex; align-items:center; gap:10px; }
  .langtog { display:inline-flex; border:1px solid var(--line); border-radius:999px; overflow:hidden; }
  .langtog button { background:transparent; color:var(--dim); border:none; padding:7px 13px;
    font-weight:700; font-size:13px; font-family:inherit; }
  .langtog button.on { background:var(--lantern); color:#1a1206; }
  .ghlink { color:var(--dim); text-decoration:none; font-weight:700; font-size:13px;
    border:1px solid var(--line); border-radius:999px; padding:7px 14px; white-space:nowrap; }
  .ghlink:hover { color:var(--ink); border-color:var(--lantern-dim); }

  /* ── Model loader strip ── */
  .modelbar { display:flex; flex-wrap:wrap; align-items:center; gap:12px;
    background:var(--panel); border:1px solid var(--line); border-radius:var(--r);
    padding:14px 16px; margin-bottom:16px; }
  .modelbar .lead { font-weight:800; font-size:14px; }
  .modelbar .lead .dot { color:var(--lantern); }
  select { background:var(--panel2); color:var(--ink); border:1px solid var(--line);
    border-radius:9px; padding:8px 10px; font-size:13px; font-family:inherit; max-width:100%; }
  button { font-family:inherit; cursor:pointer; }
  .btn { background:var(--lantern); color:#1a1206; border:none; border-radius:10px;
    padding:9px 16px; font-weight:800; font-size:14px; }
  .btn:hover { filter:brightness(1.06); }
  .btn:disabled { opacity:.5; cursor:default; }
  .btn.pulse { animation:btnpulse 1.5s ease-in-out infinite; }
  @keyframes btnpulse { 0%,100%{ box-shadow:0 0 0 0 rgba(255,206,107,.55);} 50%{ box-shadow:0 0 0 11px rgba(255,206,107,0);} }
  #model-status { font-size:13px; color:var(--faint); font-weight:700; margin-left:auto; }
  #model-status.ready { color:var(--good); }
  #loader { display:none; flex-basis:100%; margin-top:4px; }
  #loader.show { display:block; }
  .track { height:7px; background:var(--panel2); border-radius:99px; overflow:hidden; margin-bottom:6px; }
  #load-bar { height:100%; width:0; background:linear-gradient(90deg,var(--lantern),#ffdf9c);
    transition:width .3s ease; }
  #load-text { font-size:12px; color:var(--dim); }

  /* ── World bar ── */
  .worldbar { display:flex; flex-wrap:wrap; align-items:center; gap:10px;
    background:var(--panel2); border:1px solid var(--line); border-radius:var(--r);
    padding:12px 14px; margin-bottom:16px; }
  .world-facts { display:flex; align-items:center; gap:8px; font-weight:800; font-size:14px; flex-wrap:wrap; }
  .pill { background:rgba(255,255,255,.05); border:1px solid var(--line); border-radius:99px;
    padding:5px 11px; font-size:12px; color:var(--dim); font-weight:700; }
  .state { border-radius:99px; padding:5px 12px; font-size:12px; font-weight:800; }
  .state.calm { background:rgba(79,214,127,.14); color:var(--good); }
  .state.bad  { background:rgba(232,86,75,.16); color:var(--bad); }
  .world-actions { display:flex; flex-wrap:wrap; gap:8px; margin-left:auto; }
  .wbtn { background:var(--panel); color:var(--ink); border:1px solid var(--line);
    border-radius:9px; padding:8px 12px; font-size:13px; font-weight:700; }
  .wbtn:hover { border-color:var(--lantern-dim); background:#1a2130; }
  .wbtn.danger:hover { border-color:rgba(232,86,75,.4); color:#ffb4ac; }

  /* ── Main layout ── */
  .main { display:grid; grid-template-columns:270px 1fr; gap:16px; }
  @media (max-width:760px){ .main { grid-template-columns:1fr; } }

  .col-title { font-size:12px; font-weight:800; letter-spacing:.12em; color:var(--faint);
    text-transform:uppercase; margin:2px 4px 10px; }

  /* Roster */
  #roster { display:flex; flex-direction:column; gap:9px; }
  .villager { display:flex; align-items:center; gap:11px; width:100%; text-align:left;
    background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:11px 12px; color:var(--ink); transition:border-color .15s, background .15s; }
  .villager:hover { background:#1a2130; }
  .villager.on { border-color:var(--lantern); background:#1b2233;
    box-shadow:0 0 0 1px var(--lantern-dim), 0 8px 24px rgba(0,0,0,.35); }
  .villager .ava { font-size:26px; width:34px; text-align:center; }
  .villager .who { flex:1; display:flex; flex-direction:column; line-height:1.25; min-width:0; }
  .villager .who b { font-size:15px; }
  .villager .who small { color:var(--faint); font-size:12px; font-weight:600; }
  .villager .mood { font-size:20px; }

  /* Chat */
  .chat { background:var(--panel); border:1px solid var(--line); border-radius:var(--r);
    display:flex; flex-direction:column; min-height:520px; overflow:hidden; }
  .chat-head { display:flex; align-items:center; gap:11px; padding:14px 16px;
    border-bottom:1px solid var(--line); }
  #chat-ava { font-size:24px; }
  .chat-head b { font-size:15px; }
  .chat-head .env { margin-left:auto; font-size:11px; color:var(--faint); font-weight:700;
    letter-spacing:.04em; }
  #log { flex:1; overflow-y:auto; padding:18px 16px; display:flex; flex-direction:column; gap:14px; }
  .hint { color:var(--faint); font-size:14px; line-height:1.6; text-align:center;
    margin:auto 8px; max-width:440px; }

  .msg { display:flex; gap:10px; max-width:100%; }
  .msg.you { justify-content:flex-end; }
  .bubble { border-radius:13px; padding:10px 14px; font-size:15px; line-height:1.55;
    max-width:78%; word-break:break-word; }
  .msg.you .bubble { background:#26314a; color:#eaf1ff; border-bottom-right-radius:4px; }
  .msg.npc { align-items:flex-start; }
  .npc-body { display:flex; flex-direction:column; gap:5px; min-width:0; }
  .npc-line { background:var(--panel2); border:1px solid var(--line); border-bottom-left-radius:4px; }
  .npc-line.thinking { color:var(--faint); min-width:44px; }
  .npc-line.thinking::after { content:"● ● ●"; font-size:11px; letter-spacing:1px;
    animation:blink 1.2s steps(1) infinite; }
  @keyframes blink { 50%{ opacity:.25; } }
  .action { font-size:12px; color:var(--faint); font-style:italic; padding-left:3px; }
  .badge { flex:none; font-weight:900; font-size:12px; border-radius:8px; padding:4px 9px;
    letter-spacing:.02em; text-transform:lowercase; }
  .badge.good { background:var(--good); color:#08240f; }
  .badge.bad  { background:var(--bad); color:#fff; }
  .badge.warn { background:var(--warn); color:#2a1c02; }
  .badge.cold { background:var(--cold); color:#04203f; }
  .badge.muted{ background:#39435a; color:#dfe6f2; }

  .msg.event { justify-content:center; font-family:ui-monospace,monospace; font-size:13px;
    color:var(--lantern); background:rgba(255,206,107,.07); border:1px dashed var(--lantern-dim);
    border-radius:10px; padding:9px 12px; align-items:center; gap:8px; text-align:center; }
  .msg.event b { color:var(--bad); }
  .evt-dot { width:8px; height:8px; border-radius:50%; background:var(--bad);
    box-shadow:0 0 0 0 rgba(232,86,75,.6); animation:pulse 1.4s infinite; flex:none; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(232,86,75,.5);} 70%{box-shadow:0 0 0 8px rgba(232,86,75,0);} }

  .composer { display:flex; gap:9px; padding:12px 14px; border-top:1px solid var(--line); }
  #input { flex:1; background:var(--panel2); border:1px solid var(--line); border-radius:10px;
    padding:11px 13px; color:var(--ink); font-size:15px; font-family:inherit; resize:none; }
  #input:focus { outline:none; border-color:var(--lantern-dim); }
  #input:disabled { opacity:.5; }
  #send { background:var(--lantern); color:#1a1206; border:none; border-radius:10px;
    padding:0 18px; font-weight:800; font-size:15px; }
  #send:disabled { opacity:.4; cursor:default; }

  /* Crisis atmosphere */
  #vignette { position:fixed; inset:0; pointer-events:none; opacity:0; z-index:2;
    background:radial-gradient(120% 90% at 50% 120%, rgba(232,86,75,.22), transparent 55%);
    transition:opacity .6s ease; }
  body.crisis #vignette { opacity:1; }

  /* Toast */
  #toast { position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(20px);
    background:#1c2434; border:1px solid var(--lantern-dim); color:var(--ink);
    padding:11px 18px; border-radius:999px; font-size:14px; font-weight:700; z-index:9;
    opacity:0; pointer-events:none; transition:opacity .25s, transform .25s; box-shadow:0 12px 40px rgba(0,0,0,.5);
    max-width:90vw; text-align:center; }
  #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

  /* WebGPU gate */
  #gate { position:fixed; inset:0; z-index:20; display:none; align-items:center; justify-content:center;
    background:rgba(6,9,14,.86); backdrop-filter:blur(3px); padding:24px; }
  #gate.show { display:flex; }
  .gate-card { max-width:460px; background:var(--panel); border:1px solid var(--line);
    border-radius:16px; padding:26px; text-align:center; }
  .gate-card h2 { margin:0 0 10px; font-size:20px; }
  .gate-card p { color:var(--dim); font-size:14px; line-height:1.65; }
  .gate-card a { color:var(--lantern); }

  footer { margin-top:26px; color:var(--faint); font-size:13px; line-height:1.7; text-align:center; }
  footer code { color:var(--dim); }
  footer a { color:var(--dim); }
</style>
</head>
<body>
<div id="vignette"></div>
<div class="wrap">

  <header>
    <div class="brand">마을 · <em>Maeul</em><small>ON-DEVICE NPC LLM</small></div>
    <div class="tag" id="tagline" data-i18n-html="tagline"></div>
    <div class="head-right">
      <div class="langtog" id="langtog">
        <button data-lang="ko">한국어</button>
        <button data-lang="en">English</button>
      </div>
      <a class="ghlink" href="https://github.com/MUSE-CODE-SPACE/maeul" target="_blank" rel="noopener">★ GitHub</a>
    </div>
  </header>

  <!-- Model loader -->
  <div class="modelbar" id="controls">
    <span class="lead"><span class="dot">◆</span> <span data-i18n="modelLabel"></span></span>
    <select id="model-select" aria-label="model"></select>
    <button class="btn" id="load-btn" data-i18n="loadBtn"></button>
    <span id="model-status" data-i18n="statusIdle"></span>
    <div id="loader">
      <div class="track"><div id="load-bar"></div></div>
      <div id="load-text"></div>
    </div>
  </div>

  <!-- World bar -->
  <div class="worldbar">
    <div class="world-facts">
      <span class="pill" id="world-day">Day 1</span>
      <span class="pill" id="world-time"></span>
      <span class="pill" id="world-weather"></span>
      <span class="state calm" id="world-state"></span>
    </div>
    <div class="world-actions">
      <button class="wbtn danger" id="btn-flood"></button>
      <button class="wbtn danger" id="btn-quake"></button>
      <button class="wbtn danger" id="btn-fire"></button>
      <button class="wbtn" id="btn-calm"></button>
      <button class="wbtn" id="btn-day"></button>
    </div>
  </div>

  <!-- Main -->
  <div class="main">
    <div>
      <div class="col-title" data-i18n="rosterTitle"></div>
      <div id="roster"></div>
      <div class="col-title" style="margin-top:16px;" data-i18n="ambientTitle"></div>
      <button class="wbtn" id="btn-idle" style="width:100%;"></button>
    </div>

    <div class="chat">
      <div class="chat-head">
        <span id="chat-ava">🌿</span>
        <b id="chat-name"></b>
        <span class="env mono">on-device · $0</span>
      </div>
      <div id="log"></div>
      <div class="composer">
        <textarea id="input" rows="1"></textarea>
        <button id="send" data-i18n="send"></button>
      </div>
    </div>
  </div>

  <footer>
    <span data-i18n="footer1"></span><br>
    <span data-i18n-html="footer2"></span>
  </footer>
</div>

<div id="toast"></div>

<div id="gate">
  <div class="gate-card">
    <h2 data-i18n="gateTitle"></h2>
    <p data-i18n-html="gateBody"></p>
  </div>
</div>

<script type="module" src="./app.js"></script>
</body>
</html>
